<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto API_ETEC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="card card-form">
        <div class="card-header">
        <h1 style="text-align: center;">Cadastro de Usuários</h1>
        <h2 style="text-align: center; margin-bottom: 24px;">Enrico Spinardi 3ºDS </h2>
        </div>
                <div class="card-body">
                <form id="formulario" action="/usuarios" method="POST"> 
                    <label class="form-label"for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" class="form-control"required>

                    <label class="form-label" for="idade">Idade:</label>
                    <input class="form-control" type="number" id="idade" name="idade" required>

                    <label class="form-label" for="email">E-mail:</label>
                    <input class="form-control" type="email" id="email" name="email" required>

                    <label class="form-label" for="cidade">Cidade:</label>
                    <input class="form-control" type="text" id="cidade" name="cidade" required>
                    <div class="d-flex justify-content-center mt-4"> 
                    <button  type="submit" class="btn btn-primary mb-3">Cadastrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
